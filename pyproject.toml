[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scratch-ml"
version = "0.1.0"
description = "Sandbox environment for experimenting with time series modeling and Ray Train/Tune, MLflow, and ONNX integration."
authors = [{ name = "Syam Evani", email = "syamevani@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.6",
    "mlflow>=3.4.0",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "pip-tools>=7.5.0",
    "pre-commit>=4.5.1",
    "ray[default,train,tune]>=2.49.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "tensorboard>=2.20.0",
    "torch>=2.8.0",
]

[dependency-groups]
dev = ["ruff>=0.9.0"]

[tool.setuptools.packages.find]
where = []

# =============================================================================
# Ruff -- linter and formatter
# =============================================================================
[tool.ruff]
line-length = 200
target-version = "py312"

# Exclude notebooks
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors   -- indentation, whitespace, syntax
    "W",  # pycodestyle warnings -- whitespace before comment, blank lines
    "F",  # pyflakes             -- undefined names, unused imports
    "I",  # isort                -- import ordering: stdlib -> third-party -> first-party
    "UP", # pyupgrade            -- modernise syntax (e.g. use list[] not List[])
    "B",  # flake8-bugbear       -- common bugs and design issues
    "ANN",# type annotation rules
]
ignore = [
    "E221", # multiple spaces before operator
    "E241", # multiple spaces after ','
    "E203", # makes it compat with Black-style slicing
    "E501", # ignore line length
]

[tool.ruff.lint.isort]
# Tells isort which modules belong to this project (placed in their own import group)
known-first-party = ["models", "path"]
